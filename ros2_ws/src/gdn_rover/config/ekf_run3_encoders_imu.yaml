# Run 3: proprioception only (encoders + BNO085). Measures pure drift.
ekf_filter_node:
  ros__parameters:
    frequency: 50.0
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom
    odom0: /wheel/odom
    #          x     y     z     roll  pitch yaw   vx    vy    vz    vroll vpitch vyaw  ax    ay    az
    odom0_config: [false, false, false, false, false, false, true, true, false, false, false, true, false, false, false]
    odom0_rejection_threshold: 5.0       # Mahalanobis: drop slip spikes
    imu0: /imu/data
    imu0_config:  [false, false, false, false, false, true, false, false, false, false, false, true, false, false, false]
    imu0_relative: true                  # magnetometer heading is unreliable near motors/steel
    imu0_remove_gravitational_acceleration: true
